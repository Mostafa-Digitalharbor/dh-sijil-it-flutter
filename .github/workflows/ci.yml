name: CI

# Quality gate. Runs on every push and pull request; nothing merges red.
on:
  push:
    branches: [main, develop, "release/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.3"

jobs:
  analyze:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        # Regenerated rather than trusted from the checkout, so a stale
        # committed lib/l10n/generated cannot mask a broken ARB file.
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        # analysis_options.yaml promotes the architecture guardrails
        # (avoid_dynamic_calls, unawaited_futures, close_sinks) to errors.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Report outdated packages
        # Informational only — a new upstream release must never break CI.
        continue-on-error: true
        run: flutter pub outdated

  build-android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        # Proves the Android toolchain and every plugin still link on each PR.
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-it-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  build-ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: analyze
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        # Unsigned: verifies the Xcode project and CocoaPods integration
        # without needing certificates on a PR.
        run: flutter build ios --release --no-codesign
