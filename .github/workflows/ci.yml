name: CI

# Quality gate. Runs on every push and pull request; nothing merges red.
# Runs on every branch, not a named few. The gate was silently not running on
# `sijil-mostafa` for the whole build, and 29 files drifted out of `dart format`
# without anything going red — a quality gate nobody's branch triggers is a
# quality gate that does not exist.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.35.3"

jobs:
  analyze:
    name: Format, analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Generate localizations
        # Regenerated rather than trusted from the checkout, so a stale
        # committed lib/l10n/generated cannot mask a broken ARB file.
        run: flutter gen-l10n

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Static analysis
        # analysis_options.yaml promotes the architecture guardrails
        # (avoid_dynamic_calls, unawaited_futures, close_sinks) to errors.
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Unit & widget tests
        run: flutter test --coverage --reporter expanded

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency health
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Report outdated packages
        # Informational only — a new upstream release must never break CI.
        continue-on-error: true
        run: flutter pub outdated

  build-android:
    name: Android debug build
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build debug APK
        # Proves the Android toolchain and every plugin still link on each PR.
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v7
        with:
          name: sijil-it-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  integration-test:
    name: On-device journey
    runs-on: ubuntu-latest
    needs: analyze
    timeout-minutes: 45

    # The widget suite proves every screen in isolation on a desktop VM with
    # every platform channel stubbed. Three classes of failure survive that and
    # only appear on a real engine, and all three are ones a user meets first:
    #
    #   * `local_auth` needs MainActivity to be a FlutterFragmentActivity. A
    #     plain one builds, installs, launches, and throws the first time
    #     somebody turns the unlock on.
    #   * The PDF embeds fonts read from the real asset bundle, which only
    #     exists in an installed build.
    #   * `Isolate.run`, which the XML-RPC codec uses for large payloads, has
    #     to actually spawn on Android.
    #
    # Slow — an emulator boot is most of it — so it runs after `analyze`
    # rather than beside it, and does not gate the faster jobs.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # The emulator runs at a usable speed only with hardware acceleration,
      # and the runner ships KVM disabled for unprivileged users.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'             | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64

      # A first boot writes the snapshot the cache above stores; every later
      # run restores it and starts in seconds rather than minutes.
      - name: Create AVD and generate snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot generated."

      - name: Run the on-device suites
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # Animations off: `pumpAndSettle` waits for them, and a 45-minute
          # budget is not the place to spend it on ripples.
          disable-animations: true
          script: |
            flutter test integration_test/full_journey_test.dart --timeout 180s
            flutter test integration_test/device_features_test.dart --timeout 180s
            flutter test integration_test/image_memory_test.dart --timeout 180s

  build-ios:
    name: iOS build (no codesign)
    runs-on: macos-latest
    needs: analyze
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        # Unsigned: verifies the Xcode project and CocoaPods integration
        # without needing certificates on a PR.
        run: flutter build ios --release --no-codesign
