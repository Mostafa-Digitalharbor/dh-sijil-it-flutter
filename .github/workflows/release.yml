name: Release

# Cuts signed builds from a version tag, e.g. `v1.0.0`, and — when the store
# credentials are configured — ships them to the internal test tracks.
#
# ── Required secrets ────────────────────────────────────────────────────────
# Android (always):
#   ANDROID_KEYSTORE_BASE64             base64 of the upload .jks (single line)
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Android (optional — enables the Play internal-track upload):
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64
#
# iOS (optional — without these the iOS job archives unsigned, as before):
#   IOS_DIST_CERT_BASE64                base64 of the Apple Distribution .p12
#   IOS_DIST_CERT_PASSWORD              its export password
#   IOS_PROVISIONING_PROFILE_BASE64     base64 of the App Store .mobileprovision
#   IOS_TEAM_ID                         10-character Apple team id
#   IOS_KEYCHAIN_PASSWORD               any random string; locks the temp keychain
#
# iOS (optional — enables the TestFlight upload):
#   APP_STORE_CONNECT_KEY_ID
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_PRIVATE_KEY_BASE64
#
# Crash reporting (optional — a build with no DSN never initialises the SDK):
#   SENTRY_DSN
#
# Each optional group degrades to a skipped step rather than a red build, so
# the pipeline is useful from the first tag rather than only once every store
# account exists.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override"
        required: false
      track:
        description: "Play track"
        required: false
        default: internal
        type: choice
        options: [internal, alpha, beta, production]

env:
  FLUTTER_VERSION: "3.35.3"

jobs:
  # ── Version ───────────────────────────────────────────────────────────────
  #
  # Resolved once, in its own job, so both platforms build the *same* release
  # rather than two builds that happen to share a tag. Ten seconds of runner
  # time buys the guarantee that a tester comparing the Android and iOS builds
  # of "1.0.0 (101)" is comparing the same thing.
  prepare:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build_number: ${{ steps.version.outputs.build_number }}
      build_name: ${{ steps.version.outputs.build_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Resolve build number and name
        id: version
        # Play rejects any bundle whose versionCode it has seen before, and the
        # rejection arrives after the upload rather than before the build — so
        # the number has to be right the first time, not fixed on the retry.
        #
        # `github.run_number` is monotonic per workflow but starts at 1, and 1
        # is exactly what the first *manual* upload uses: Play will not let the
        # API create the opening release for an app that has never shipped, so
        # somebody always uploads a bundle by hand before CI ever runs. The
        # offset keeps CI permanently clear of that hand-uploaded range instead
        # of racing it.
        env:
          # Raise this only if more than 100 bundles are ever uploaded by hand.
          OFFSET: 100
        run: |
          set -euo pipefail

          if [ -n "${{ inputs.build_number }}" ]; then
            NUMBER="${{ inputs.build_number }}"
          else
            NUMBER=$(( OFFSET + ${{ github.run_number }} ))
          fi

          # The tag is the version, not pubspec.yaml. Deriving it the other way
          # means `git tag v1.0.1` on an unbumped pubspec ships a build that
          # calls itself 1.0.0 — and the store, the crash reports and the tag
          # then disagree about which release a bug is in.
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d+ -f1)
          fi

          echo "Releasing $NAME ($NUMBER)"
          echo "build_number=$NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_name=$NAME" >> "$GITHUB_OUTPUT"

  # ── Android ───────────────────────────────────────────────────────────────
  android:
    name: Signed Android release
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Re-run the quality gate
        # A tag build must never ship something CI has not verified.
        run: |
          flutter gen-l10n
          flutter analyze --fatal-infos --fatal-warnings
          flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        # Whitespace is stripped before decoding rather than after failing on
        # it. These secrets are pasted by a human through a clipboard, and a
        # stray newline is the single most common thing to survive that trip —
        # `base64 --decode` answers it with "invalid input" and no indication
        # of which secret, thirty minutes into a build.
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          if ! printf '%s' "$KEYSTORE_B64" | tr -d '[:space:]' \
               | base64 --decode > android/app/release.jks 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64 — it was"
            echo "::error::truncated or mangled on the way into the secret."
            echo "::error::Expected length: 5880 characters."
            exit 1
          fi
          # A keystore is a ZIP-family container; an empty or half-copied
          # secret decodes to something, just not to this.
          if [ ! -s android/app/release.jks ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 decoded to an empty file."
            exit 1
          fi

      - name: Write key.properties
        run: |
          cat > android/key.properties <<PROPS
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build App Bundle
        # SENTRY_DSN is a --dart-define rather than a committed constant, so a
        # build without the secret ships an app that never initialises the SDK
        # at all — which is what makes "this build reports nowhere" a fact
        # rather than a setting somebody could flip.
        run: >-
          flutter build appbundle --release
          --build-name=${{ needs.prepare.outputs.build_name }}
          --build-number=${{ needs.prepare.outputs.build_number }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Build APK
        run: >-
          flutter build apk --release
          --build-name=${{ needs.prepare.outputs.build_name }}
          --build-number=${{ needs.prepare.outputs.build_number }}
          --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          --dart-define=SENTRY_ENVIRONMENT=production

      - name: Verify the bundle carries the upload key
        # Cheap proof that the keystore actually applied. A debug-signed AAB
        # uploads fine and is rejected by Play minutes later — long after the
        # runner is gone and its logs stop being useful.
        run: |
          SIGNER=$(keytool -printcert -jarfile build/app/outputs/bundle/release/app-release.aab | grep -m1 'Owner:' || true)
          echo "Bundle signer: $SIGNER"
          case "$SIGNER" in
            *"Android Debug"*)
              echo "::error::The bundle is debug-signed — key.properties did not apply."
              exit 1 ;;
          esac

      - name: Decode Play service account
        id: play
        env:
          PLAY_JSON_B64: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        # Also accepts the raw JSON, not only base64. Somebody will eventually
        # paste the service-account file's contents straight in — it is a text
        # file, so pasting it is the obvious move — and failing that on a
        # technicality helps nobody.
        run: |
          if [ -z "$PLAY_JSON_B64" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Play upload skipped — GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 is unset."
            exit 0
          fi

          case "$(printf '%s' "$PLAY_JSON_B64" | head -c 1)" in
            '{') printf '%s' "$PLAY_JSON_B64" > play-service-account.json ;;
            *)
              if ! printf '%s' "$PLAY_JSON_B64" | tr -d '[:space:]' \
                   | base64 --decode > play-service-account.json 2>/dev/null; then
                echo "::error::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 is neither"
                echo "::error::valid base64 nor raw JSON — it was truncated or"
                echo "::error::mangled on the way into the secret."
                echo "::error::Expected length: 3132 characters."
                exit 1
              fi ;;
          esac

          # Validated here rather than trusted, because the next thing to touch
          # this file is an action whose failure message is about Google's API
          # rather than about the file it was handed.
          if ! python3 -c "import json,sys; d=json.load(open('play-service-account.json')); sys.exit(0 if d.get('type')=='service_account' else 1)"; then
            echo "::error::The decoded file is not a Google service-account key."
            exit 1
          fi
          echo "Service account: $(python3 -c "import json;print(json.load(open('play-service-account.json'))['client_email'])")"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Upload to Play internal track
        if: steps.play.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: play-service-account.json
          packageName: net.digitalharbor.sijilit
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track || 'internal' }}
          status: completed

      - name: Remove signing material
        # Belt and braces: the runner is ephemeral, but never leave a keystore
        # lying around in a workspace that a later step can read.
        if: always()
        run: rm -f android/app/release.jks android/key.properties play-service-account.json

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-it-android
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

  # ── iOS ───────────────────────────────────────────────────────────────────
  ios:
    name: Signed iOS release
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Check for signing material
        id: signing
        env:
          CERT: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$PROFILE" ] && [ -n "$TEAM" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS signing skipped — building an unsigned archive."
          fi

      # Unsigned fallback, so a tag cut before the Apple account exists still
      # proves the Xcode project and CocoaPods integration link.
      - name: Build iOS (unsigned)
        if: steps.signing.outputs.configured == 'false'
        run: flutter build ios --release --no-codesign

      - name: Check the certificate before Apple sees it
        if: steps.signing.outputs.configured == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        # `import-codesign-certs` decodes the base64 with Node's Buffer, which
        # *silently drops* characters outside the alphabet rather than failing.
        # A clipboard-mangled secret therefore produces a corrupt .p12 with no
        # complaint, and the first sign of trouble is `security` reporting
        # "SecKeychainItemImport: Unable to decode the provided data" — a
        # message that means "this file is not a PKCS#12", and which a wrong
        # *password* produces as well. Two very different faults, one opaque
        # error, and no way to tell them apart from the log.
        #
        # So both are checked here, separately, before Apple is involved.
        run: |
          RECEIVED=$(printf '%s' "$CERT_B64" | tr -d '[:space:]' | wc -c | tr -d ' ')
          echo "IOS_DIST_CERT_BASE64: $RECEIVED characters after stripping whitespace"

          if ! printf '%s' "$CERT_B64" | tr -d '[:space:]' \
               | base64 --decode > /tmp/dist.p12 2>/dev/null; then
            echo "::error::IOS_DIST_CERT_BASE64 is not valid base64 — it was"
            echo "::error::truncated or mangled on the way into the secret."
            echo "::error::Received $RECEIVED characters."
            exit 1
          fi

          # A PKCS#12 is DER: it starts with a SEQUENCE tag, 0x30.
          if [ "$(head -c 1 /tmp/dist.p12 | xxd -p)" != "30" ]; then
            echo "::error::IOS_DIST_CERT_BASE64 decoded to $(wc -c < /tmp/dist.p12) bytes"
            echo "::error::that are not a PKCS#12 container. The secret holds"
            echo "::error::something other than the base64 of the .p12 file."
            exit 1
          fi

          # Apple's exports use RC2-40 for the certificate bag, which OpenSSL 3
          # serves only from the legacy provider while LibreSSL takes it
          # directly — so which invocation works is a property of the runner,
          # not of the file. Either succeeding is a pass.
          if openssl pkcs12 -in /tmp/dist.p12 -noout -passin env:CERT_PASSWORD 2>/dev/null \
             || openssl pkcs12 -in /tmp/dist.p12 -noout -legacy -passin env:CERT_PASSWORD 2>/dev/null; then
            echo "Certificate decodes and the password opens it."
          else
            # Truncation lands here too: a half-copied file still begins with
            # 0x30, so it passes the tag check and fails to open. The received
            # length is the tell, which is why it is printed rather than left
            # for the reader to infer from a password message.
            echo "::error::Could not open the certificate. Two possible causes:"
            echo "::error::  1. IOS_DIST_CERT_BASE64 is truncated. It decoded to"
            echo "::error::     $(wc -c < /tmp/dist.p12) bytes from $RECEIVED characters;"
            echo "::error::     a whole file is base64 length = ceil(bytes/3)*4."
            echo "::error::  2. IOS_DIST_CERT_PASSWORD is wrong. It must hold the"
            echo "::error::     export password only — no label, no extra text."
            exit 1
          fi
          rm -f /tmp/dist.p12

      - name: Import distribution certificate
        if: steps.signing.outputs.configured == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          keychain-password: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}

      - name: Install provisioning profile
        if: steps.signing.outputs.configured == 'true'
        id: profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          DEST="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DEST"

          if ! printf '%s' "$PROFILE_B64" | tr -d '[:space:]' \
               | base64 --decode > /tmp/profile.mobileprovision 2>/dev/null; then
            echo "::error::IOS_PROVISIONING_PROFILE_BASE64 is not valid base64 —"
            echo "::error::it was truncated or mangled on the way into the secret."
            echo "::error::Expected length: 16348 characters."
            exit 1
          fi

          # Read the profile's own name and UUID rather than hard-coding them.
          # A hard-coded profile name is the most common reason an otherwise
          # correct iOS pipeline fails — and it fails at export, twenty
          # minutes into the build.
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist)
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" /tmp/profile.plist)
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/profile.plist)
          cp /tmp/profile.mobileprovision "$DEST/$UUID.mobileprovision"

          echo "Installed provisioning profile '$NAME' ($UUID) for $BUNDLE"
          case "$BUNDLE" in
            *".net.digitalharbor.sijilit")
              ;;
            *)
              echo "::error::Profile is for $BUNDLE, not net.digitalharbor.sijilit."
              exit 1 ;;
          esac
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Configure manual signing
        if: steps.signing.outputs.configured == 'true'
        # Written here rather than committed: the team id is not public, and a
        # checked-in manual-signing block breaks every developer's local
        # `flutter run` on a machine without this exact profile installed.
        run: |
          cat > ios/Flutter/Release.xcconfig <<XCCONFIG
          #include "Generated.xcconfig"
          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = ${{ secrets.IOS_TEAM_ID }}
          PROVISIONING_PROFILE_SPECIFIER = ${{ steps.profile.outputs.name }}
          CODE_SIGN_IDENTITY = Apple Distribution
          XCCONFIG

          cat > ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.IOS_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>net.digitalharbor.sijilit</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
          </dict>
          </plist>
          PLIST

      - name: Build signed IPA
        if: steps.signing.outputs.configured == 'true'
        id: ipa
        run: |
          set -euo pipefail
          flutter build ipa --release \
            --build-name=${{ needs.prepare.outputs.build_name }}             --build-number=${{ needs.prepare.outputs.build_number }} \
            --dart-define=SENTRY_DSN=${{ secrets.SENTRY_DSN }} \
            --dart-define=SENTRY_ENVIRONMENT=production \
            --export-options-plist=ios/ExportOptions.plist

          # Resolved rather than assumed. `flutter build ipa` names the archive
          # after the Xcode product, which is not the package name, not the
          # scheme, and changes if the display name does — so a hardcoded path
          # is a guess that fails *after* a forty-minute build, at the upload.
          IPA=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::No .ipa was produced. Contents of build/ios/ipa:"
            ls -la build/ios/ipa || true
            exit 1
          fi
          echo "Built $IPA"
          echo "path=$IPA" >> "$GITHUB_OUTPUT"

      # The icon that App Store Connect shows for a TestFlight build comes
      # from CFBundleIconName in the *built* Info.plist, and from the compiled
      # Assets.car beside it. Neither is in the repository: Xcode writes the
      # key itself from ASSETCATALOG_COMPILER_APPICON_NAME, and `actool`
      # produces the archive.
      #
      # That is exactly why a build once reached TestFlight with the
      # placeholder tile and nothing in the diff to explain it — the two
      # settings that produce the icon had been damaged in project.pbxproj and
      # left no trace anywhere a reviewer would look.
      #
      # So the artefact is opened and asked directly, before it is uploaded.
      - name: Verify the IPA carries its app icon
        if: steps.signing.outputs.configured == 'true'
        run: |
          set -euo pipefail
          WORK=$(mktemp -d)
          unzip -q "${{ steps.ipa.outputs.path }}" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "::error::No .app inside the IPA."
            exit 1
          fi

          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName'             "$APP/Info.plist" 2>/dev/null || true)
          if [ -z "$ICON_NAME" ]; then
            echo "::error::CFBundleIconName is missing from the built Info.plist."
            echo "App Store Connect reads that key to find the icon; without it"
            echo "the build uploads fine and shows the placeholder tile."
            exit 1
          fi
          echo "CFBundleIconName = $ICON_NAME"

          # The catalog has to actually contain it. A correct key pointing at
          # an icon set that never compiled fails the same way, silently.
          if [ ! -f "$APP/Assets.car" ]; then
            echo "::error::Assets.car is missing — the asset catalog did not compile."
            exit 1
          fi
          if ! xcrun assetutil --info "$APP/Assets.car" | grep -q "$ICON_NAME"; then
            echo "::error::Assets.car contains no icon set named $ICON_NAME."
            exit 1
          fi

          # The 1024-pt marketing icon is the one the store listing uses, and
          # Apple rejects it outright if it carries an alpha channel.
          if [ ! -f "$APP/AppIcon60x60@2x.png" ]; then
            echo "::warning::No AppIcon60x60@2x.png beside Assets.car."
          fi
          echo "Icon verified in the archive."
          rm -rf "$WORK"

      - name: Check for App Store Connect credentials
        if: steps.signing.outputs.configured == 'true'
        id: asc
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::TestFlight upload skipped — App Store Connect key is unset."
          fi

      - name: Upload to TestFlight
        if: steps.asc.outputs.configured == 'true'
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_B64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
          IPA: ${{ steps.ipa.outputs.path }}
        # `altool` is invoked directly rather than through an action, because
        # the key has to reach it as a *file* in a directory altool searches,
        # named `AuthKey_<key id>.p8`. An action that takes the key as a string
        # input has to guess whether that string is PEM or base64, and guessing
        # wrong produces "(-39) does not contain a valid authentication key" —
        # which reads like a bad key rather than a bad encoding.
        #
        # The secret stays base64 on purpose: a PEM is multi-line, and newlines
        # are exactly what a value does not reliably survive on its way through
        # a clipboard into a secret box.
        run: |
          set -euo pipefail

          mkdir -p ~/private_keys
          KEY_FILE=~/private_keys/AuthKey_${KEY_ID}.p8
          if ! printf '%s' "$KEY_B64" | tr -d '[:space:]' \
               | base64 --decode > "$KEY_FILE" 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY_BASE64 is not valid base64."
            echo "::error::Expected length: 344 characters."
            exit 1
          fi

          # Checked before altool sees it, because altool reports every problem
          # with this file — wrong encoding, wrong key, empty — as the same -39.
          if ! head -1 "$KEY_FILE" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::The decoded App Store Connect key is not a PEM private"
            echo "::error::key. The secret must hold the base64 of the .p8 file"
            echo "::error::Apple issued, not the file's text and not a key id."
            rm -f "$KEY_FILE"
            exit 1
          fi

          echo "Uploading $IPA to TestFlight as key $KEY_ID"
          trap 'rm -f "$KEY_FILE"' EXIT
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER"

      - name: Remove signing material
        if: always()
        run: |
          rm -f /tmp/profile.mobileprovision /tmp/profile.plist
          rm -f ios/ExportOptions.plist
          git checkout -- ios/Flutter/Release.xcconfig 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.configured == 'true'
        with:
          name: sijil-it-ios
          path: build/ios/ipa/*.ipa
          retention-days: 90

  # ── GitHub release ────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: [android, ios]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
