name: Release

# Cuts a signed build from a version tag, e.g. `v1.0.0`.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64   base64 of the release .jks
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# The iOS lane stays unsigned until an Apple Developer account and the
# matching certificates are added — see docs/IMPLEMENTATION_PLAN.md, Phase 11.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override"
        required: false

env:
  FLUTTER_VERSION: "3.35.3"

jobs:
  android:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Re-run the quality gate
        # A tag build must never ship something CI has not verified.
        run: |
          flutter gen-l10n
          flutter analyze --fatal-infos --fatal-warnings
          flutter test

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not configured."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 --decode > android/app/release.jks

      - name: Write key.properties
        run: |
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Build APK
        run: flutter build apk --release

      - name: Remove signing material
        # Belt and braces: the runner is ephemeral, but never leave a keystore
        # lying around in a workspace that later steps can read.
        if: always()
        run: rm -f android/app/release.jks android/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: sijil-it-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 90

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk

  ios:
    name: iOS archive (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        run: flutter build ios --release --no-codesign

      # Swap for a signed `flutter build ipa --export-options-plist=...` step
      # plus an `apple-actions/import-codesign-certs` action once the Apple
      # Developer account is provisioned.
