org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# ── Barcode model: downloaded, not bundled ─────────────────────────────────
#
# mobile_scanner links one of two ML Kit artefacts. The default,
# `com.google.mlkit:barcode-scanning`, compiles the detection model into the
# APK as libbarhopper_v3.so — 4.2 MB on arm64, and 12 MB across the three ABIs
# in the sideload APK. This switches to the Play Services variant, which keeps
# the model in Google Play Services and shares it with every other app on the
# device that scans.
#
# The trade-off is real and worth stating: the first scan on a fresh install
# needs Google Play Services present and a moment of network to fetch the
# model. On a handset that is nothing; on a rugged warehouse device with no
# Play Services it is the difference between scanning and not scanning.
#
# Reverting is this one line. If the fleet includes Play-Services-less
# hardware, delete it and take the 4 MB.
dev.steenbakker.mobile_scanner.useUnbundled=true
