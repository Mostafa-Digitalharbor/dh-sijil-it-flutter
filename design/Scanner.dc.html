<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0A1026;
      color: #FFFFFF;
      font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    a { color: #2FE3A8; }
    a:hover { color: #14C289; }
    svg { display: block; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0A1026; display: flex; flex-direction: column; overflow: hidden;">

  <!-- camera viewport -->
  <div style="flex-grow: 1; position: relative; background: radial-gradient(120% 80% at 50% 32%, #1D2A55 0%, #0F1734 46%, #070C1D 100%); display: flex; flex-direction: column; overflow: hidden;">

    <div style="height: 44px; flex: none;"></div>

    <!-- top bar -->
    <div style="flex: none; display: flex; align-items: center; gap: 8px; padding: 2px 14px 0;">
      <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </div>
      <div style="flex-grow: 1; text-align: center; font-size: 14px; font-weight: 700; color: #FFFFFF;">Scan asset</div>
      <div style="width: 38px; height: 38px; border-radius: 12px; background: rgba(47,227,168,0.18); display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#2FE3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      </div>
    </div>

    <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center;">
      <!-- viewfinder -->
      <div style="width: 244px; height: 244px; position: relative;">
        <div style="position: absolute; inset: 0; border-radius: 28px; background: rgba(255,255,255,0.04);"></div>

        <div style="position: absolute; left: 0; top: 0; width: 54px; height: 54px; border-top: 3.5px solid #2FE3A8; border-left: 3.5px solid #2FE3A8; border-radius: 28px 0 0 0;"></div>
        <div style="position: absolute; right: 0; top: 0; width: 54px; height: 54px; border-top: 3.5px solid #2FE3A8; border-right: 3.5px solid #2FE3A8; border-radius: 0 28px 0 0;"></div>
        <div style="position: absolute; left: 0; bottom: 0; width: 54px; height: 54px; border-bottom: 3.5px solid #2FE3A8; border-left: 3.5px solid #2FE3A8; border-radius: 0 0 0 28px;"></div>
        <div style="position: absolute; right: 0; bottom: 0; width: 54px; height: 54px; border-bottom: 3.5px solid #2FE3A8; border-right: 3.5px solid #2FE3A8; border-radius: 0 0 28px 0;"></div>

        <!-- scan line -->
        <div style="position: absolute; left: 18px; right: 18px; top: 118px; height: 2px; background: linear-gradient(90deg, rgba(47,227,168,0) 0%, #2FE3A8 50%, rgba(47,227,168,0) 100%); box-shadow: 0 0 18px rgba(47,227,168,0.8);"></div>
      </div>
    </div>

    <div style="flex: none; text-align: center; padding: 0 40px;">
      <div style="font-size: 13.5px; font-weight: 700; color: #FFFFFF;">Point at an asset code</div>
      <div style="font-size: 11.5px; font-weight: 500; color: #8E9AC4; margin-top: 5px; line-height: 1.5; text-wrap: pretty;">QR codes, equipment barcodes and printed serial numbers all work.</div>
    </div>

    <!-- mode switch -->
    <div style="flex: none; display: flex; justify-content: center; margin-top: 18px;">
      <div style="display: flex; background: rgba(255,255,255,0.10); border-radius: 999px; padding: 3px;">
        <div style="font-size: 11.5px; font-weight: 800; color: #16255C; background: #2FE3A8; border-radius: 999px; padding: 7px 18px;">QR code</div>
        <div style="font-size: 11.5px; font-weight: 700; color: #C6CFE8; padding: 7px 18px;">Barcode</div>
      </div>
    </div>

    <!-- result sheet -->
    <div style="flex: none; margin: 20px 16px 18px; background: #FFFFFF; border-radius: 18px; padding: 13px 14px; display: flex; align-items: center; gap: 12px;">
      <div style="flex: none; width: 42px; height: 42px; border-radius: 13px; background: #D3F9EC; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#0F9E73" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m8.4 12 2.5 2.5 4.7-5.2"/></svg>
      </div>
      <div style="flex-grow: 1; min-width: 0;">
        <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.6px; color: #6E7799;">MATCHED asset://87</div>
        <div style="font-size: 13.5px; font-weight: 700; color: #16255C; margin-top: 2px;">MacBook Pro M4</div>
        <div style="font-size: 10.5px; font-weight: 500; color: #6E7799;">DH-LAP-0027 &middot; Assigned to Ahmed</div>
      </div>
      <div style="flex: none; height: 36px; background: #16255C; border-radius: 10px; display: flex; align-items: center; padding: 0 14px;">
        <span style="font-size: 12px; font-weight: 700; color: #FFFFFF;">Open</span>
      </div>
    </div>

  </div>

  <!-- bottom navigation -->
  <div style="flex: none; height: 86px; background: #FFFFFF; border-top: 1px solid #E4E8F2; padding: 9px 6px 0; display: flex;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="width: 58px; height: 30px; display: flex; align-items: center; justify-content: center; color: #6E7799;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>
      </div>
      <div style="font-size: 10px; font-weight: 600; color: #6E7799;">Dashboard</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="width: 58px; height: 30px; display: flex; align-items: center; justify-content: center; color: #6E7799;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v9H4z"/><path d="M2 18h20"/></svg>
      </div>
      <div style="font-size: 10px; font-weight: 600; color: #6E7799;">Assets</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="width: 58px; height: 30px; border-radius: 999px; background: #D3F9EC; display: flex; align-items: center; justify-content: center; color: #16255C;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/><path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/></svg>
      </div>
      <div style="font-size: 10px; font-weight: 800; color: #16255C;">Scan</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="width: 58px; height: 30px; display: flex; align-items: center; justify-content: center; color: #6E7799;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.4"/><path d="M5 20a7 7 0 0 1 14 0"/></svg>
      </div>
      <div style="font-size: 10px; font-weight: 600; color: #6E7799;">Employees</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;">
      <div style="width: 58px; height: 30px; display: flex; align-items: center; justify-content: center;">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="#6E7799"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>
      </div>
      <div style="font-size: 10px; font-weight: 600; color: #6E7799;">More</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
