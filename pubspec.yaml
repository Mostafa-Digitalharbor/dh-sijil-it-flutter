name: sijil_it
description: "Sijil IT — Standalone IT Assets Management app integrated with Odoo over XML-RPC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management (MVVM ViewModels = Cubits) ──────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # ── Functional error handling (Either<Failure, T>) ───────────────────────
  dartz: ^0.10.1

  # ── Dependency injection (Service Locator pattern) ───────────────────────
  get_it: ^8.0.3

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Networking / XML-RPC ─────────────────────────────────────────────────
  dio: ^5.7.0
  xml: ^6.5.0

  # ── Secure storage & caching ─────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  shared_preferences: ^2.3.5

  # ── Connectivity ─────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.1

  # ── QR / Barcode ─────────────────────────────────────────────────────────
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # ── UI / UX ──────────────────────────────────────────────────────────────
  google_fonts: ^6.2.1
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.20.2
  image_picker: ^1.1.2
  package_info_plus: ^8.1.2
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/

  # Bundle a product font here later (Inter / Plus Jakarta Sans) to drop the
  # runtime google_fonts download. See docs/ARCHITECTURE.md § Theming.
