name: sijil_it
description: "Sijil IT — Standalone IT Assets Management app integrated with Odoo over XML-RPC."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ── State management (MVVM ViewModels = Cubits) ──────────────────────────
  flutter_bloc: ^9.1.1
  bloc: ^9.0.0
  equatable: ^2.0.7

  # ── Functional error handling (Either<Failure, T>) ───────────────────────
  dartz: ^0.10.1

  # ── Dependency injection (Service Locator pattern) ───────────────────────
  get_it: ^8.0.3

  # ── Navigation ───────────────────────────────────────────────────────────
  go_router: ^14.8.1

  # ── Networking / XML-RPC ─────────────────────────────────────────────────
  dio: ^5.7.0
  xml: ^7.0.1

  # ── Secure storage & caching ─────────────────────────────────────────────
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.11.0
  hive_ce_flutter: ^2.3.0
  shared_preferences: ^2.3.5

  # ── Connectivity ─────────────────────────────────────────────────────────
  connectivity_plus: ^6.1.1

  # ── QR / Barcode ─────────────────────────────────────────────────────────
  mobile_scanner: ^5.2.3
  qr_flutter: ^4.1.0

  # ── UI / UX ──────────────────────────────────────────────────────────────
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  cupertino_icons: ^1.0.8

  # ── Utilities ────────────────────────────────────────────────────────────
  intl: ^0.20.3
  image_picker: ^1.1.2
  package_info_plus: ^8.1.2

  # Opens the employee profile's Email and Call actions in the device's own
  # mail client and dialler. No other deep linking is used.
  url_launcher: ^6.3.1
  logger: ^2.5.0

  # ── Crash reporting ──────────────────────────────────────────────────────
  #
  # Every event is scrubbed through LogSanitizer before it leaves the device
  # (core/observability/crash_reporter.dart). Off unless a DSN is compiled in,
  # so a developer build never reports and a customer can be handed a build
  # that reports nowhere.
  sentry_flutter: ^9.27.0
  # Used for exactly one call: `openAppSettings()`.
  #
  # The scanner's "camera access is off" screen tells the user to turn the
  # permission back on, and on Android there is no way to re-request it once
  # they have chosen "Don't allow" — the system dialog never appears again.
  # Without a button that opens the app's settings page, the instruction is
  # accurate and unreachable.
  #
  # No permission *requests* go through this package: mobile_scanner and
  # image_picker each ask for their own, which is what keeps the prompt
  # attached to the action that needs it.
  #
  # Held at 12 deliberately. `permission_handler_android` 14 builds with
  # `kotlin { compilerOptions { jvmTarget } }`, which needs a newer Kotlin
  # Gradle plugin than android/settings.gradle.kts pins (2.1.0) and fails the
  # Android build outright. Raising this means raising the Kotlin plugin for
  # every module in the project at the same time — worth doing on purpose, not
  # as a side effect of `pub upgrade` on a package used for one function.
  permission_handler: ^12.0.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  pdf: ^3.13.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  # Generates lib/l10n/app_localizations.dart from the ARB files.
  generate: true

  assets:
    - assets/

  fonts:
    # Latin UI face. Variable file, wght axis 100-900 -- the dashboard numerals
    # are set at w900, which the previous face (Space Grotesk, ceiling w700)
    # could not render without the engine synthesising a smeared faux-bold.
    - family: Archivo
      fonts:
        - asset: assets/fonts/Archivo-Variable.ttf

    # Identifiers only: asset tags, serials, ISO dates, hosts, versions. Those
    # get compared character by character, so they need a face where 0/O and
    # 1/l differ and where columns line up. Never used for prose.
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf

    # Arabic companion. Space Grotesk ships zero Arabic glyphs, so this is
    # registered as a per-glyph fallback rather than a separate theme: mixed
    # "MacBook Pro / ماك بوك برو" strings render correctly in one TextStyle.
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700

# ── Launcher icons ─────────────────────────────────────────────────────────
#
# Regenerate with: dart run flutter_launcher_icons
#
# The sources under assets/icon/ are derived from assets/sijil-app-icon.png:
# a full-bleed square for iOS (which rounds it itself and rejects an alpha
# channel), and a separate foreground for Android's adaptive icon, whose
# content has to survive being masked to a circle, a squircle or a teardrop.
flutter_launcher_icons:
  image_path: "assets/icon/app-icon.png"

  android: true
  adaptive_icon_background: "#16255C"
  adaptive_icon_foreground: "assets/icon/app-icon-foreground.png"
  # Android 13 themed icons tint a monochrome layer to the wallpaper palette.
  adaptive_icon_monochrome: "assets/icon/app-icon-monochrome.png"
  # The sources are already sized for the mask-safe zone, so the tool must not
  # inset them again — its 16% default would stack with ours and leave the
  # mark floating small in the middle of the plate.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 23

  ios: true
  # iOS rejects an alpha channel in an app icon outright at submission.
  remove_alpha_ios: true
